name: Update follower count

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Secrets needed (Settings -> Secrets and variables -> Actions):
#   YOUTUBE_API_KEY  - Google Cloud Console -> enable "YouTube Data API v3" -> Credentials -> API key
#   BEHOLD_FEED_URL  - behold.so (free plan) -> connect the Instagram account via its
#                      login popup -> "+ Add Feed" -> JSON -> copy the feed URL
#                      (https://feeds.behold.so/xxxx). Behold holds its own Meta-approved
#                      app and refreshes the Graph API token itself, so no Meta developer
#                      portal and no 60-day token rotation. Kept as a secret only so the
#                      free plan's 1,200 requests/month can't be burned by strangers.
# TikTok needs no secret (public page scrape). If a secret is missing, that platform is
# skipped and data/followers.json keeps its last known value.

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-followers.mjs
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          BEHOLD_FEED_URL: ${{ secrets.BEHOLD_FEED_URL }}
      - name: Commit updated follower count
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/followers.json
          git diff --staged --quiet || git commit -m "chore: update YouTube follower count"
          git push
